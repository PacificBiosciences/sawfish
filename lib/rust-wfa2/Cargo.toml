[package]
name = "rust-wfa2"
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["Haibao Tang"]
include = ["src/**/*", "LICENSE", "README.md", "CHANGELOG.md"]

[workspace]
members = ["wfa2-sys"]

[dependencies]
serde = { version = "1.0.150", features = ["derive"] }
wfa2-sys = { version = "0.1.0", path = "wfa2-sys" }
